<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none" role="img" aria-label="STEM and Robotics Workshop">
  <defs>
    <linearGradient id="stemBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2a32"/>
      <stop offset="100%" stop-color="#0f1920"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#stemBg)"/>

  <!-- Circuit grid pattern -->
  <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2">
    <path d="M100 150 L250 150 L300 200 L500 200 L550 150 L700 150"/>
    <path d="M150 400 L280 400 L320 360 L480 360 L520 400 L680 400"/>
    <circle cx="250" cy="150" r="5" fill="#38bdf8"/>
    <circle cx="500" cy="200" r="5" fill="#38bdf8"/>
    <circle cx="320" cy="360" r="5" fill="#38bdf8"/>
  </g>

  <!-- Central Robotic Rover / Mechanism -->
  <g transform="translate(280, 160)">
    <!-- Chassis -->
    <rect x="40" y="90" width="160" height="90" rx="12" fill="#29404f" stroke="url(#cyanGrad)" stroke-width="3"/>
    <!-- Sensor eyes / Camera -->
    <circle cx="90" cy="65" r="18" fill="#1b2a32" stroke="url(#cyanGrad)" stroke-width="3"/>
    <circle cx="90" cy="65" r="8" fill="#38bdf8"/>
    <circle cx="150" cy="65" r="18" fill="#1b2a32" stroke="url(#cyanGrad)" stroke-width="3"/>
    <circle cx="150" cy="65" r="8" fill="#38bdf8"/>
    <!-- Wheels -->
    <rect x="15" y="110" width="25" height="65" rx="6" fill="#111827"/>
    <rect x="200" y="110" width="25" height="65" rx="6" fill="#111827"/>
    <!-- Robotic Arm -->
    <path d="M120 90 L120 40 L160 20" stroke="#c59b27" stroke-width="6" stroke-linecap="round"/>
    <circle cx="160" cy="20" r="8" fill="#e8bf58"/>
    <!-- Digital wave pulse -->
    <path d="M60 135 L80 135 L90 120 L105 150 L120 125 L135 140 L150 135 L180 135" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title overlay banner -->
  <rect x="180" y="520" width="440" height="48" rx="8" fill="#154231" stroke="#c59b27" stroke-width="1.5"/>
  <text x="400" y="550" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="1">ROBOTICS &amp; CODING WORKSHOP</text>
</svg>
