<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none" role="img" aria-label="Student Leadership and Debate Society">
  <defs>
    <linearGradient id="leadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#154231"/>
      <stop offset="100%" stop-color="#0a241a"/>
    </linearGradient>
    <linearGradient id="podiumGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#e8c468"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#leadBg)"/>

  <!-- Presentation Stage Backdrop -->
  <path d="M100 480 L700 480 L640 260 L160 260 Z" fill="#1b4d3a" opacity="0.6"/>

  <!-- Speaker Podium -->
  <g transform="translate(320, 200)">
    <!-- Lectern Stand -->
    <polygon points="30,80 130,80 115,260 45,260" fill="#2d5e4a" stroke="url(#podiumGold)" stroke-width="2"/>
    <!-- Angled Top -->
    <polygon points="15,60 145,60 130,85 30,85" fill="#39735b" stroke="url(#podiumGold)" stroke-width="2"/>
    <!-- School Emblem on Podium -->
    <circle cx="80" cy="140" r="28" fill="#154231" stroke="url(#podiumGold)" stroke-width="2"/>
    <path d="M80 125 C75 120, 68 120, 64 122 L64 135 C68 133, 75 133, 80 137 C85 133, 92 133, 96 135 L96 122 C92 120, 85 120, 80 125 Z" fill="#ffffff"/>
    <!-- Microphone -->
    <path d="M50 60 C50 35, 60 25, 75 22" stroke="url(#podiumGold)" stroke-width="3" fill="none"/>
    <rect x="75" y="16" width="16" height="12" rx="4" fill="url(#podiumGold)"/>
  </g>

  <!-- Title overlay banner -->
  <rect x="180" y="520" width="440" height="48" rx="8" fill="#ffffff" stroke="#c59b27" stroke-width="1.5"/>
  <text x="400" y="550" text-anchor="middle" fill="#154231" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1">STUDENT LEADERSHIP &amp; DEBATE</text>
</svg>
