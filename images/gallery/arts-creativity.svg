<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none" role="img" aria-label="Creative Arts and Design Studio">
  <defs>
    <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f5ed"/>
      <stop offset="100%" stop-color="#ebe5d6"/>
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f0eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#artBg)"/>
  
  <!-- Studio window glow -->
  <rect x="80" y="60" width="640" height="420" rx="16" fill="#ffffff" opacity="0.6"/>

  <!-- Easel Frame Left -->
  <g transform="translate(180, 100)">
    <!-- Tripod legs -->
    <line x1="220" y1="20" x2="130" y2="440" stroke="#8c6239" stroke-width="14" stroke-linecap="round"/>
    <line x1="220" y1="20" x2="310" y2="440" stroke="#8c6239" stroke-width="14" stroke-linecap="round"/>
    <line x1="220" y1="20" x2="220" y2="450" stroke="#704e2d" stroke-width="12" stroke-linecap="round"/>
    <!-- Horizontal shelf -->
    <rect x="100" y="320" width="240" height="20" rx="4" fill="#a47547"/>
    <!-- Canvas -->
    <rect x="120" y="80" width="200" height="240" rx="6" fill="url(#canvasGrad)" stroke="#dcd5c9" stroke-width="2"/>
    <!-- Artwork on canvas -->
    <circle cx="220" cy="180" r="45" fill="#e0a93b" opacity="0.8"/>
    <path d="M140 270 C170 200, 210 240, 250 190 C280 230, 300 270, 310 290 L130 290 Z" fill="#1b4d3a" opacity="0.9"/>
    <circle cx="270" cy="140" r="15" fill="#b91c1c" opacity="0.7"/>
  </g>

  <!-- Palette on table -->
  <g transform="translate(520, 360)">
    <path d="M70 120 C30 110, 10 70, 20 30 C30 -5, 80 -10, 120 15 C150 35, 170 70, 150 100 C130 130, 95 130, 70 120 Z" fill="#deb887"/>
    <circle cx="120" cy="80" r="12" fill="#ebe5d6" stroke="#c49a6c" stroke-width="2"/>
    <circle cx="45" cy="30" r="8" fill="#1b4d3a"/>
    <circle cx="70" cy="22" r="8" fill="#c59b27"/>
    <circle cx="95" cy="25" r="8" fill="#b91c1c"/>
    <circle cx="125" cy="40" r="8" fill="#1e3a8a"/>
    <circle cx="50" cy="65" r="8" fill="#0d9488"/>
  </g>

  <!-- Title overlay banner -->
  <rect x="200" y="520" width="400" height="48" rx="8" fill="#154231"/>
  <text x="400" y="550" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="1">CREATIVE ARTS &amp; DESIGN STUDIO</text>
</svg>
