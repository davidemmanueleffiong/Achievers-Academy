<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none" role="img" aria-label="Achievers Academy Crest and Wordmark">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d3a"/>
      <stop offset="100%" stop-color="#0f3325"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf58"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9f7717"/>
    </linearGradient>
  </defs>

  <!-- Crest Shield Group -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield with Gold Rim -->
    <path d="M52 2 C84 2, 98 16, 98 42 C98 76, 52 100, 52 100 C52 100, 6 76, 6 42 C6 16, 20 2, 52 2 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Inner Inset Shield Outline -->
    <path d="M52 8 C80 8, 92 20, 92 42 C92 72, 52 93, 52 93 C52 93, 12 72, 12 42 C12 20, 24 8, 52 8 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Open Book Symbol (Wisdom & Academics) -->
    <path d="M52 50 C44 44, 30 44, 23 47 L23 68 C30 65, 44 65, 52 71 C60 65, 74 65, 81 68 L81 47 C74 44, 60 44, 52 50 Z" 
          fill="#ffffff" opacity="0.95"/>
    <!-- Book Spine & Pages Lines -->
    <path d="M52 50 L52 71 M24 64 C31 61, 43 61, 50 67 M54 67 C61 61, 73 61, 80 64" 
          stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Torch / Flame above Book (Enlightenment) -->
    <path d="M52 20 C48 26, 45 31, 48 35 C50 38, 54 38, 56 35 C59 31, 56 26, 52 20 Z" 
          fill="url(#goldGrad)"/>
    <path d="M52 25 C50 28, 49 31, 51 33 C52 35, 54 34, 54 33 C55 30, 53 28, 52 25 Z" 
          fill="#fff5d6"/>
    <!-- Torch Handle -->
    <path d="M49 37 L55 37 L53 43 L51 43 Z" fill="url(#goldGrad)"/>

    <!-- Laurel Wreath Leaves (Left & Right) -->
    <path d="M22 36 C18 41, 17 48, 19 55 M18 43 C15 45, 14 49, 16 52 M19 52 C17 56, 17 60, 21 64" 
          stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M82 36 C86 41, 87 48, 85 55 M86 43 C89 45, 90 49, 88 52 M85 52 C87 56, 87 60, 83 64" 
          stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Star / Achievement at the base -->
    <polygon points="52,80 54,85 59,85 55,88 57,93 52,90 47,93 49,88 45,85 50,85" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography / Wordmark -->
  <!-- Primary School Name -->
  <text x="126" y="52" font-family="'Lora', Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="1.5" fill="#154231">ACHIEVERS ACADEMY</text>
  
  <!-- Subtitle / Motto Badge -->
  <text x="128" y="77" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.2" fill="#9f7717" text-transform="uppercase">Excellence • Character • Wisdom</text>

  <!-- Established or Academic Identifier line -->
  <line x1="128" y1="88" x2="390" y2="88" stroke="#c59b27" stroke-width="1" stroke-opacity="0.4"/>
  <text x="128" y="101" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="#525866">Founded on Strong Foundations &amp; Academic Rigour</text>
</svg>
